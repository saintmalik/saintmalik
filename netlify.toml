# OSS list is assets/oss.json (GitHub Action refreshes it).
# Home writing list fetches /blog-feed.xml (proxied Docusaurus RSS).

[build]
  command = "true"

[[redirects]]
from = "/favicon.ico"
to = "/assets/favicon.ico"
status = 200

[[redirects]]
from = "/oss.json"
to = "/assets/oss.json"
status = 200

[[redirects]]
from = "/blog-feed.xml"
to = "https://blog.saintmalik.me/rss.xml"
status = 200
force = true

[[redirects]]
from = "/posts/"
to = "https://blog.saintmalik.me"
status = 301
force = true

[[redirects]]
from = "https://saintmalik.me/posts"
to = "https://blog.saintmalik.me"
status = 301
force = true

[[redirects]]
from = "/blog/"
to = "https://blog.saintmalik.me"
status = 301
force = true

[[redirects]]
from = "/open-source"
to = "/open-source.html"
status = 200

[[redirects]]
from = "/resume"
to = "/resume.html"
status = 200

[[redirects]]
from = "/projects"
to = "/projects.html"
status = 200

[[redirects]]
from = "/talks"
to = "/talks.html"
status = 200

[[headers]]
for = "/*"
  [headers.values]
  Link = "</llms.txt>; rel=\"describedby\"; type=\"text/plain\""

[[headers]]
for = "/llms.txt"
  [headers.values]
  Content-Type = "text/plain; charset=utf-8"
  Link = "</llms.txt>; rel=\"describedby\"; type=\"text/plain\""

[[headers]]
for = "/llms-full.txt"
  [headers.values]
  Content-Type = "text/plain; charset=utf-8"
  Link = "</llms.txt>; rel=\"describedby\"; type=\"text/plain\""

[[headers]]
for = "/blog-feed.xml"
  [headers.values]
  Content-Type = "application/xml; charset=utf-8"
  Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
for = "/sitemap.xml"
  [headers.values]
  Content-Type = "application/xml; charset=utf-8"

[[headers]]
for = "/robots.txt"
  [headers.values]
  Content-Type = "text/plain; charset=utf-8"
